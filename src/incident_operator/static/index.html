<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incidents</title>
<style>
:root {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --border: #33332f;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #8d8c84; --accent: #3987e5;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f4f2; --surface: #fcfcfb; --surface-2: #f0f0ed; --border: #dcdcd6;
  --text: #0b0b0b; --text-2: #52514e; --muted: #77766f; --accent: #2a78d6;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
a { color: var(--accent); text-decoration: none; cursor: pointer; }
button { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 10px; cursor: pointer; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--border);
  background: var(--surface); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
main { padding: 16px; max-width: 1600px; margin: 0 auto; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-2); margin: 22px 0 8px; font-weight: 600; }
h2:first-child { margin-top: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--text-2); font-weight: 500; font-size: 12px; white-space: nowrap; }
td.n { text-align: right; white-space: nowrap; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--surface-2); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 1px 8px; border-radius: 99px;
  background: var(--surface-2); border: 1px solid var(--border); white-space: nowrap; }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--muted)); }
.s-new, .s-triaging { --c: var(--warning); } .s-analysed { --c: var(--good); } .s-triage_failed { --c: var(--critical); }
.s-repeat, .s-skipped { --c: var(--muted); } .s-investigating, .s-advising { --c: var(--accent); }
nav a { color: var(--text-2); padding: 4px 8px; border-radius: 6px; } nav a.on { color: var(--text); background: var(--surface-2); }
.turn { border-top: 1px solid var(--border); padding: 10px 0; } .turn:first-child { border-top: 0; padding-top: 0; }
.findings { font-size: 14.5px; line-height: 1.55; } .findings .t { white-space: pre-wrap; }
.findings h3 { font-size: 13px; color: var(--text-2); margin: 14px 0 4px; font-weight: 600; }
.sev-critical { --c: var(--critical); } .sev-warning { --c: var(--warning); }
.preview { color: var(--text-2); max-width: 0; width: 100%; min-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.banner { background: color-mix(in srgb, var(--critical) 18%, var(--surface)); border: 1px solid var(--critical);
  padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; }
.hidden { display: none !important; }
.grid2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-word; }
.answer { white-space: pre-wrap; font-size: 14.5px; line-height: 1.55; }
pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; overflow: auto;
  max-height: 420px; margin: 6px 0 0; font: 12px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; }
details { margin-top: 8px; } summary { cursor: pointer; color: var(--text-2); }
.err { color: var(--critical); }
</style>
</head>
<body>
<header>
  <h1><a href="#/" style="color:inherit">Incidents</a></h1>
  <nav><a href="#/" id="nav-incidents">Incidents</a> <a href="#/runbooks" id="nav-runbooks">Runbooks</a></nav>
  <span class="muted" style="font-size:12px">suggestions only: nothing here changes the cluster</span>
  <div class="spacer"></div>
  <span class="muted" style="font-size:12px" id="updated"></span>
  <button id="theme" title="Toggle light/dark">◐</button>
</header>
<main>
  <div class="banner hidden" id="banner"></div>
  <div id="view-list">
    <div class="grid2">
      <div><h2>Incidents</h2><div class="card scroll" style="padding:0" id="incidents"><div class="empty">Loading…</div></div></div>
      <div><h2>Needs a runbook</h2><div class="card scroll" style="padding:0" id="runbooks"><div class="empty">Loading…</div></div></div>
    </div>
  </div>
  <div id="view-incident" class="hidden"></div>
  <div id="view-runbooks" class="hidden"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dur = s => { s = Math.max(0, s); return s < 60 ? Math.round(s) + "s" : s < 3600 ? Math.round(s / 60) + "m" : s < 86400 ? (s / 3600).toFixed(1) + "h" : (s / 86400).toFixed(1) + "d"; };
const ago = t => t ? dur((Date.now() - new Date(t)) / 1000) + " ago" : "–";
const clock = t => t ? new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "–";
const TARGET = ["namespace", "pod", "job_name", "deployment", "statefulset", "daemonset", "node", "instance"];
const target = l => TARGET.filter(k => l[k]).map(k => `${k}=${l[k]}`).join(" ");
const STATUS = { new: "new", triaging: "triaging", investigating: "investigating", advising: "advising", analysed: "analysed", triage_failed: "triage failed", repeat: "repeat", skipped: "skipped" };
const state = { lastOk: null };
const lget = k => { try { return localStorage.getItem("io." + k); } catch { return null; } };
const lset = (k, v) => { try { localStorage.setItem("io." + k, v); } catch {} };
function theme(t) { if (t === "light") document.documentElement.dataset.theme = "light"; else delete document.documentElement.dataset.theme; }
theme(lget("theme"));
$("#theme").onclick = () => { const t = document.documentElement.dataset.theme === "light" ? "dark" : "light"; lset("theme", t); theme(t); };

async function api(path) {
  const r = await fetch(path, { headers: { Accept: "application/json" } });
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return r.json();
}
function failing(err) {
  $("#banner").classList.toggle("hidden", !err);
  if (err) $("#banner").textContent = `Can't reach the server (${err.message}). Retrying; showing data from ${state.lastOk ? ago(state.lastOk) : "never"}.`;
}
setInterval(() => { $("#updated").textContent = state.lastOk ? "updated " + ago(state.lastOk) : ""; }, 1000);

async function refresh() {
  const m = location.hash.match(/^#\/incident\/(\d+)/), rb = location.hash.startsWith("#/runbooks");
  $("#view-list").classList.toggle("hidden", !!m || rb);
  $("#view-incident").classList.toggle("hidden", !m);
  $("#view-runbooks").classList.toggle("hidden", !rb);
  $("#nav-incidents").classList.toggle("on", !rb);
  $("#nav-runbooks").classList.toggle("on", rb);
  try {
    if (m) renderIncident(await api("/api/incidents/" + m[1]));
    else if (rb) renderRunbooks(await api("/api/runbooks"));
    else renderList(await api("/api/incidents"));
    state.lastOk = new Date(); failing(null);
  } catch (e) {
    if (m && e.message.startsWith("404")) $("#view-incident").innerHTML = `<div class="card empty">Incident ${esc(m[1])} doesn't exist. <a href="#/">All incidents</a></div>`;
    else failing(e);
  }
}

function renderList(d) {
  $("#incidents").innerHTML = d.incidents.length ? `<table><thead><tr><th>When</th><th>Alert</th><th>Target</th><th>Status</th><th>Answered by</th><th>Suggestion</th></tr></thead><tbody>
    ${d.incidents.map(i => `<tr class="click" data-id="${i.id}">
      <td title="${esc(clock(i.first_seen))}" style="white-space:nowrap">${ago(i.first_seen)}${i.alert_resolved_at ? `<div class="muted" style="font-size:12px">resolved</div>` : ""}${i.repeats ? `<div class="muted" style="font-size:12px;white-space:normal;min-width:110px" title="Fired again ${i.repeats}× since; not triaged again">+${i.repeats} repeat${i.repeats > 1 ? "s" : ""}, last ${ago(i.last_repeat)}${i.repeats_open ? " (firing)" : ""}</div>` : ""}</td>
      <td><span class="tag sev-${esc(i.severity || "")}">${esc(i.alertname)}</span>${i.runbook ? `<div class="muted" style="font-size:12px;margin-top:3px">runbook ${esc(i.runbook)}</div>` : ""}</td>
      <td class="muted" style="font-size:12.5px">${esc(target(i.labels)) || "–"}</td>
      <td><span class="tag s-${esc(i.status)}">${esc(STATUS[i.status] || i.status)}</span></td>
      <td style="white-space:nowrap">${i.analysis_model ? `${esc(i.analysis_model)}<div class="muted" style="font-size:12px">${esc(i.analysis_worker || "")}</div>` : "–"}</td>
      <td class="preview" title="${esc(i.analysis_preview || "")}">${esc(i.analysis_preview || "")}</td></tr>`).join("")}</tbody></table>`
    : `<div class="empty">No incidents yet. They appear when Alertmanager sends an alert that's routed here (the ones that are also mailed).</div>`;
  document.querySelectorAll("#incidents tr.click").forEach(r => r.onclick = () => location.hash = "#/incident/" + r.dataset.id);
  $("#runbooks").innerHTML = d.needs_runbook.length ? `<table><thead><tr><th>Alert</th><th class="n">Incidents</th><th class="n">Open</th><th>Last</th></tr></thead><tbody>
    ${d.needs_runbook.map(r => `<tr><td>${esc(r.alertname)}</td><td class="n">${r.incidents}</td><td class="n">${r.open}</td><td class="muted">${ago(r.last_seen)}</td></tr>`).join("")}</tbody></table>
    <p class="muted" style="margin:8px 12px;font-size:12px">Counts include repeats. Alerts that fired with no runbook. A runbook for the most frequent ones gives the model the evidence and context it's missing.</p>`
    : `<div class="empty">Nothing yet.</div>`;
}

function renderIncident(i) {
  const ann = i.annotations || {};
  // The page refreshes every 10 s: keep open/closed sections as the user left them (same incident only).
  const view = $("#view-incident"), keep = view.dataset.id === String(i.id);
  const was = keep ? [...view.querySelectorAll("details")].map(d => d.open) : null;
  view.dataset.id = i.id;
  view.innerHTML = `
    <p><a href="#/">← All incidents</a></p>
    <div class="grid2">
      <div>
        <h2>${esc(i.alertname)} <span class="tag s-${esc(i.status)}" style="text-transform:none">${esc(STATUS[i.status] || i.status)}</span></h2>
        <div class="card">
          ${i.status === "analysed" && i.findings ? findingsHtml(i)
              + `<p class="muted" style="margin:12px 0 0;font-size:12.5px">Answered by <b>${esc(i.analysis_model)}</b> on ${esc(i.analysis_worker || "?")} after ${i.turns.filter(t => t.session === "investigation").length} investigation turn(s) · suggestion only, nothing was changed</p>`
            : i.status === "analysed" ? `<div class="answer">${esc(i.analysis)}</div>
              <p class="muted" style="margin:12px 0 0;font-size:12.5px">Answered by <b>${esc(i.analysis_model)}</b> on ${esc(i.analysis_worker || "?")}${turn && turn.ran_model && turn.ran_model !== turn.model ? ` (fallback from ${esc(turn.model)})` : ""} · suggestion only, nothing was changed</p>`
            : i.status === "triage_failed" ? `<div class="err">The model couldn't analyse this: ${esc(i.error || "unknown error")}</div>`
            : i.status === "repeat" ? `<div>The same problem was triaged recently, so this wasn't triaged or mailed again. See <a href="#/incident/${i.repeat_of}">incident #${i.repeat_of}</a>.</div>`
            : i.status === "skipped" ? `<div class="muted">${esc(i.error || "Not triaged.")}</div>`
            : `<div class="muted">${i.status === "new" ? "Collecting evidence…" : i.status === "investigating" ? `Investigating with runbook ${esc(i.runbook)}, turn ${i.turns.length}…` : i.status === "advising" ? "Findings are in; writing the suggestion…" : "Waiting for the model…"} This page refreshes on its own.</div>${i.findings ? findingsHtml(i) : ""}`}
        </div>
        ${i.repeats.length ? `<h2>Fired again since (${i.repeats.length}${i.repeats.length === 100 ? "+" : ""}), not triaged again</h2>
          <div class="card scroll" style="padding:0"><table><thead><tr><th>#</th><th>Fired</th><th>Target</th><th>Resolved</th></tr></thead><tbody>
          ${i.repeats.map(r => `<tr><td><a href="#/incident/${r.id}">${r.id}</a></td><td>${clock(r.first_seen)}</td><td class="muted" style="font-size:12.5px">${esc(target(r.labels)) || "–"}</td><td>${r.alert_resolved_at ? clock(r.alert_resolved_at) : "firing"}</td></tr>`).join("")}
          </tbody></table></div>` : ""}
        ${i.status === "repeat" || i.status === "skipped" ? "" : `<h2>Evidence the model was given</h2>
        <div class="card">${i.evidence.length ? i.evidence.map(e => `<details ${e.kind === "logs" || e.trigger !== "generic" ? "" : "open"}><summary>${e.trigger === "requested" ? `<span class="muted">asked for in turn ${e.round}:</span> ` : ""}${e.operation ? `<b>${esc(e.operation)}</b> <span class="muted">${esc(e.source !== e.operation ? e.source : "")}</span>` : esc(e.source)}${e.truncated ? " <span class='muted'>(truncated)</span>" : ""}</summary>
            ${e.content != null ? `<pre>${esc(e.content)}</pre>` : `<div class="err" style="margin-top:6px">could not read: ${esc(e.error)}</div>`}</details>`).join("")
          : `<div class="muted">None: the alert names no pod, job, workload or node.</div>`}</div>`}
        ${i.turns.length ? `<h2>Model turns</h2><div class="card">${i.turns.map(turnHtml).join("")}</div>` : ""}
      </div>
      <div>
        <h2>Alert</h2>
        <div class="card"><dl class="kv">
          <dt>Severity</dt><dd>${esc(i.severity || "–")}</dd>
          <dt>Firing since</dt><dd>${clock(i.starts_at || i.first_seen)}</dd>
          <dt>Last sent</dt><dd>${ago(i.last_seen)}</dd>
          <dt>Resolved</dt><dd>${i.alert_resolved_at ? clock(i.alert_resolved_at) : "no"}</dd>
          <dt>Mailed</dt><dd>${i.notified_at ? clock(i.notified_at) : i.status === "repeat" || i.status === "skipped" ? "no" : "not yet"}</dd>
          <dt>Runbook</dt><dd>${i.runbook ? `<a href="#/runbooks">${esc(i.runbook)}</a> <span class="muted" style="font-size:12px">${esc(i.runbook_rev || "")}</span>` : "none yet"}</dd>
          ${i.target ? `<dt>Target</dt><dd>${esc(i.target.kind)} ${esc(i.target.namespace ? i.target.namespace + "/" : "")}${esc(i.target.name)}</dd>` : ""}
          ${Object.entries(ann).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}
          ${Object.entries(i.labels).filter(([k]) => k !== "alertname").map(([k, v]) => `<dt>${esc(k)}</dt><dd class="muted">${esc(v)}</dd>`).join("")}
        </dl>${i.generator_url ? `<p style="margin:10px 0 0"><a href="${esc(i.generator_url)}" target="_blank" rel="noopener">Open in Prometheus</a></p>` : ""}</div>
      </div>
    </div>`;
  if (was) view.querySelectorAll("details").forEach((d, k) => { if (k < was.length) d.open = was[k]; });
}

function findingsHtml(i) {
  const f = i.findings || {}, a = i.advice;
  return `<div class="findings"><dl class="kv">
      <dt>What failed</dt><dd>${esc(f.what_failed)}</dd><dt>Where</dt><dd>${esc(f.where)}</dd>
      <dt>Confidence</dt><dd>${esc(f.confidence)}${f.matches_runbook === false ? ` <span class="err">(doesn't look like what the runbook covers)</span>` : ""}</dd>
      ${(f.evidence_refs || []).length ? `<dt>Based on</dt><dd class="muted">${esc(f.evidence_refs.join(", "))}</dd>` : ""}</dl>
    <div class="t" style="margin-top:8px">${esc(f.summary)}</div>
    ${a ? `<h3>Suggestion</h3><div class="t">${esc(a.suggestion)}</div><h3>Why</h3><div class="t">${esc(a.why)}</div>
      <h3>Will it fix itself</h3><div class="t">${esc(a.will_it_fix_itself)}</div>
      ${(a.escalate_to_human || "").trim() && !/^(none|no|n\/a)\.?$/i.test(a.escalate_to_human.trim()) ? `<h3>Escalate to a human</h3><div class="t">${esc(a.escalate_to_human)}</div>` : ""}` : ""}</div>`;
}

function turnHtml(t) {
  const o = t.output, r = t.result || {};
  const took = t.finished_at ? dur((new Date(t.finished_at) - new Date(t.submitted_at)) / 1000) : null;
  const what = !o ? "" : t.session === "investigation"
    ? (o.action === "request" ? `asked for <b>${esc((o.requests || []).join(", "))}</b>` : "finished with findings") + (o.reason ? ` <span class="muted">: ${esc(o.reason)}</span>` : "")
    : t.session === "remediation" ? "wrote the suggestion" : "";
  return `<div class="turn"><div>${t.turn}. <b>${esc(t.session)}</b> · ${t.status === "submitted" ? `<span class="muted">waiting for ${esc(t.model)}…</span>`
      : `${esc(t.ran_model || t.model)}${t.worker ? " on " + esc(t.worker) : ""}${t.ran_model && t.ran_model !== t.model ? ` <span class="muted">(fallback from ${esc(t.model)})</span>` : ""}${took ? ` · ${took}` : ""}${r.input_tokens ? ` · ${r.input_tokens} in / ${r.output_tokens} out tokens` : ""}`}</div>
    ${what ? `<div style="margin-top:4px">${what}</div>` : ""}${t.status === "failed" ? `<div class="err">${esc(t.error)}</div>` : ""}
    <details><summary>Exactly what was sent (${esc(t.prompt_version)})</summary>
      ${t.messages.slice(t.turn > 1 && t.session === "investigation" ? -1 : 0).map(m => `<div class="muted" style="margin-top:10px">${esc(m.role)}${t.turn > 1 && t.session === "investigation" ? " (earlier turns as above)" : ""}</div><pre>${esc(m.content)}</pre>`).join("")}</details>
    ${o ? `<details><summary>Reply</summary><pre>${esc(JSON.stringify(o, null, 1))}</pre></details>` : r.text ? "" : ""}</div>`;
}

function renderRunbooks(d) {
  $("#view-runbooks").innerHTML = `
    ${d.errors.length ? `<h2>Rejected files</h2><div class="card">${d.errors.map(e => `<div style="margin:4px 0"><b>${esc(e.file)}</b>: <span class="err">${esc(e.error)}</span></div>`).join("")}
      <p class="muted" style="margin:8px 0 0;font-size:12px">The last good version of a rejected file stays live; a new file that never loaded is simply absent.</p></div>` : ""}
    <h2>Runbooks (${d.runbooks.length})</h2>
    <div class="card scroll" style="padding:0">${d.runbooks.length ? `<table><thead><tr><th>Runbook</th><th>Matches</th><th>Target</th><th>Precursors</th><th>Can ask for</th><th class="n">Incidents</th><th>Last</th></tr></thead><tbody>
      ${d.runbooks.map(r => `<tr><td><b>${esc(r.name)}</b> <span class="muted" style="font-size:12px">${esc(r.rev)} · ~${r.tokens} tokens</span><div class="muted" style="font-size:12.5px;max-width:420px">${esc(r.description)}</div>${r.warnings.map(w => `<div class="err" style="font-size:12px">${esc(w)}</div>`).join("")}</td>
        <td style="font-size:12.5px">${Object.entries(r.match).map(([k, v]) => `${esc(k)} = ${esc([].concat(v).join(" | "))}`).join("<br>")}${r.priority ? `<div class="muted">priority ${r.priority}</div>` : ""}</td>
        <td style="font-size:12.5px">${r.target ? esc(r.target.kind) + `<div class="muted">${esc(r.target.from || [r.target.namespace, r.target.name].filter(Boolean).join("/"))}</div>` : "–"}</td>
        <td style="font-size:12.5px">${r.precursors.map(esc).join("<br>") || "–"}</td><td style="font-size:12.5px">${r.operations.map(esc).join("<br>") || "–"}</td>
        <td class="n">${r.incidents}</td><td class="muted">${r.last_matched ? ago(r.last_matched) : "never"}</td></tr>`).join("")}</tbody></table>`
      : `<div class="empty">No runbooks loaded. They come from the chart's files/runbooks folder.</div>`}</div>
    <h2>Read-only operations (${d.operations.length})</h2>
    <div class="card scroll" style="padding:0">${d.operations.length ? `<table><thead><tr><th>Operation</th><th>Kind</th><th>What it reads</th></tr></thead><tbody>
      ${d.operations.map(o => `<tr><td><b>${esc(o.name)}</b> <span class="muted" style="font-size:12px">${esc(o.rev)}</span></td><td class="muted">${esc(o.kind)}</td><td style="font-size:12.5px">${esc(o.description)}</td></tr>`).join("")}</tbody></table>`
      : `<div class="empty">No operations loaded.</div>`}</div>`;
}

window.addEventListener("hashchange", refresh);
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 10000);
</script>
</body>
</html>
