# For the alembic CLI while developing (alembic revision --autogenerate, alembic check). The service doesn't read this:
# it runs schema.upgrade at startup. Set the database with: alembic -x ... or edit sqlalchemy.url locally.
[alembic]
script_location = src/incident_operator/migrations
sqlalchemy.url = postgresql+psycopg://postgres@127.0.0.1:55444/io_alembic

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
