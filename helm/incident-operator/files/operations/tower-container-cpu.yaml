name: tower-container-cpu
description: Cores used by the Tower container over the last 24 hours, hourly, and the same hours one day earlier - flat or bursty, new or a daily schedule.
mutating: false
params:
  name: {from: alertLabel:name}
run:
  kind: promql-range
  queries:
    cores: 'sum(rate(container_cpu_usage_seconds_total{job="tower-cadvisor", name="{name}"}[1h]))'
    cores_yesterday: 'sum(rate(container_cpu_usage_seconds_total{job="tower-cadvisor", name="{name}"}[1h] offset 1d))'
  range: 23h
  step: 1h
budget: {maxChars: 2000}
