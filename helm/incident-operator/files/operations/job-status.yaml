name: job-status
description: The Job's conditions (failed, deadline exceeded), backoff limit and deadline, its events, and its newest pod with exit codes and log tail.
mutating: false
params:
  namespace: {from: target.namespace}
  job: {from: target.name}
run:
  kind: k8s-summary
  object: {kind: Job, namespace: "{namespace}", name: "{job}"}
budget: {maxChars: 7000}
