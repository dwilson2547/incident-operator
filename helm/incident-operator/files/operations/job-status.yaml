name: job-status
description: The Job's conditions (failed, deadline exceeded), backoff limit and deadline, its events, every attempt (pod) with its exit state, and the first failed and newest attempts' status and log tails.
mutating: false
params:
  namespace: {from: target.namespace}
  job: {from: target.name}
run:
  kind: k8s-summary
  object: {kind: Job, namespace: "{namespace}", name: "{job}"}
budget: {maxChars: 8000}
