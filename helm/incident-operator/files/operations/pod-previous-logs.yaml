name: pod-previous-logs
description: The last 120 log lines of the pod's previous (crashed) container, which usually end with the error.
mutating: false
params:
  namespace: {from: target.namespace}
  pod: {from: target.name}
run:
  kind: k8s-logs
  namespace: "{namespace}"
  pod: "{pod}"
  previous: true
  lines: 120
budget: {maxChars: 4000}
