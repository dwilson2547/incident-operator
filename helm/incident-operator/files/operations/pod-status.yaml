name: pod-status
description: The pod's phase, conditions, each container's state, restarts, last exit code and memory limit, and its recent events.
mutating: false
params:
  namespace: {from: target.namespace}
  pod: {from: target.name}
run:
  kind: k8s-summary
  object: {kind: Pod, namespace: "{namespace}", name: "{pod}"}
  logs: false
budget: {maxChars: 8000}
