name: nodes-load-now
description: Load per core and CPU busy on every cluster node right now (is this node the only one affected).
mutating: false
run:
  kind: promql
  queries:
    load15_per_core: 'max by (instance) (node_load15{job="node-exporter"}) / count by (instance) (node_cpu_seconds_total{job="node-exporter", mode="idle"})'
    cpu_busy: '1 - avg by (instance) (rate(node_cpu_seconds_total{job="node-exporter", mode="idle"}[10m]))'
budget: {maxChars: 1200}
