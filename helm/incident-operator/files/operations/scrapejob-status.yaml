name: scrapejob-status
description: The ScrapeJob as scrape-job-manager sees it - phase, consecutive failures, the last run (result, exit code, error, its Kubernetes Job), the last success, recent item counts and phase changes.
mutating: false
params:
  namespace: {from: target.namespace}
  name: {from: target.name}
run:
  kind: k8s-get
  path: /apis/scrape.danwils.com/v1alpha1/namespaces/{namespace}/scrapejobs/{name}
  fields: [status.phase, status.consecutiveFailures, status.lastRun, status.lastSuccess, status.recentItems,
           status.baselineItems, status.stale, status.suspended, status.events, spec.scraperRef]
budget: {maxChars: 2500}
