image:
  repository: dwilson2547/incident-operator
  tag: latest

# The incident page. LAN-only (cluster.local wildcard -> LAN Traefik). With oidc.issuer set, every page needs an
# authentik sign-in and only signed-in users can approve fixes; without it the page is open and fixes can't be approved.
ui:
  host: incident-operator.cluster.local
  publicUrl: http://incident-operator.cluster.local     # email links, and the sign-in callback's base
  oidc:
    issuer: ""                 # e.g. https://auth.danwils.com/application/o/incident-operator/
    clientId: incident-operator
    secret: ""                 # hand-applied Secret with key client_secret (the same value as authentik's copy)

triage:
  gpuSchedulerUrl: http://gpu-scheduler-api.gpu-scheduler.svc
  model: qwen35-9b
  fallback: gemma4-26b-a4b                # comma-separated; another model takes the job after fallbackAfterSeconds
  fallbackAfterSeconds: 60
  deadlineSeconds: 900
  maxNewTokens: 1024
  investigateMaxNewTokens: 768            # per JSON turn of a runbook investigation
  # Brakes against a noisy alert (README: Repeats and the hourly cap).
  repeatWindowSeconds: 21600              # same problem triaged within 6 h -> marked a repeat, not triaged or mailed
  maxPerHour: 12                          # triage calls per hour; the rest wait
  skipResolvedAfterSeconds: 3600          # a waiting incident resolved over an hour ago is dropped

# Read-only queries from runbook operations (promql / promql-range).
prometheusUrl: http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090

smtp:
  host: smtp.gmail.com
  port: 587
  username: dwilson2547@gmail.com
  from: "incident-operator <dwilson2547@gmail.com>"
  to: dwilson2547@gmail.com

# Created by scripts/create-secrets.sh.
secrets:
  database: incident-operator-db               # DATABASE_URL
  gpuScheduler: incident-operator-gpu-scheduler   # GPU_SCHEDULER_TOKEN
  smtp: incident-operator-smtp                 # SMTP_PASSWORD

resources:
  requests: {cpu: 20m, memory: 96Mi}
  limits: {memory: 256Mi}

executorResources:
  requests: {cpu: 5m, memory: 48Mi}
  limits: {memory: 128Mi}
