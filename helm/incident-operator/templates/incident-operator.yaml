{{- $labels := dict "app.kubernetes.io/part-of" "incident-operator" "app.kubernetes.io/managed-by" .Release.Service }}
# The environment primer every prompt carries (files/primer.md), and the runbooks and read-only operations (design
# §4.3). Each is mounted as a directory, not with subPath, so a push reaches the pod within a minute and the next
# pass re-reads it: no restart. A file that fails validation is rejected and the last good version stays live.
apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-operator-files
  labels: {{- toYaml $labels | nindent 4 }}
data:
  primer.md: |
{{ .Files.Get "files/primer.md" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-operator-runbooks
  labels: {{- toYaml $labels | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "files/runbooks/*.md" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-operator-operations
  labels: {{- toYaml $labels | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "files/operations/*.yaml" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
# Read-only: the evidence for an alert (pods and their logs, events, Jobs, workloads, nodes, scrape-job-manager's
# ScrapeJobs), and the pre/post checks of fixes. The controller changes nothing in the cluster but its own probe Jobs;
# fixes are the executor's, below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-operator
  labels: {{- toYaml $labels | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: incident-operator-read
  labels: {{- toYaml $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, nodes]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [scrape.danwils.com]
    resources: [scrapejobs, scrapers, scrapepools]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: incident-operator-read
  labels: {{- toYaml $labels | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: incident-operator-read}
subjects:
  - {kind: ServiceAccount, name: incident-operator, namespace: {{ .Release.Namespace }}}
---
# Probes (design §5.3): short Jobs in this namespace, pinned to a node with hostPID to read its /proc. Their pod spec
# is fixed in code (ops.probe_job): no volumes, no token, non-root, no capabilities.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-operator-probes
  labels: {{- toYaml $labels | nindent 4 }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-operator-probes
  labels: {{- toYaml $labels | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: incident-operator-probes}
subjects:
  - {kind: ServiceAccount, name: incident-operator, namespace: {{ .Release.Namespace }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-operator
  labels: {{- toYaml $labels | nindent 4 }}
spec:
  # One triage loop: two would submit the same incident twice.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: incident-operator}
  template:
    metadata:
      labels: {app: incident-operator}
    spec:
      serviceAccountName: incident-operator
      containers:
        - name: incident-operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - {name: ui, containerPort: 8080}
            - {name: webhook, containerPort: 8081}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.database }}, key: DATABASE_URL}}
            - name: GPU_SCHEDULER_URL
              value: {{ .Values.triage.gpuSchedulerUrl | quote }}
            - name: GPU_SCHEDULER_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.gpuScheduler }}, key: GPU_SCHEDULER_TOKEN}}
            - {name: TRIAGE_MODEL, value: {{ .Values.triage.model | quote }}}
            - {name: TRIAGE_FALLBACK, value: {{ .Values.triage.fallback | quote }}}
            - {name: TRIAGE_FALLBACK_AFTER_SECONDS, value: {{ .Values.triage.fallbackAfterSeconds | quote }}}
            - {name: TRIAGE_DEADLINE_SECONDS, value: {{ .Values.triage.deadlineSeconds | quote }}}
            - {name: TRIAGE_MAX_NEW_TOKENS, value: {{ .Values.triage.maxNewTokens | quote }}}
            - {name: TRIAGE_REPEAT_WINDOW_SECONDS, value: {{ .Values.triage.repeatWindowSeconds | quote }}}
            - {name: TRIAGE_MAX_PER_HOUR, value: {{ .Values.triage.maxPerHour | quote }}}
            - {name: TRIAGE_SKIP_RESOLVED_AFTER_SECONDS, value: {{ .Values.triage.skipResolvedAfterSeconds | quote }}}
            - {name: PRIMER_PATH, value: /etc/incident-operator/primer/primer.md}
            - {name: RUNBOOKS_DIR, value: /etc/incident-operator/runbooks}
            - {name: OPERATIONS_DIR, value: /etc/incident-operator/operations}
            - {name: PROMETHEUS_URL, value: {{ .Values.prometheusUrl | quote }}}
            - {name: PROBE_NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: PROBE_IMAGE, value: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"}
            - {name: TRIAGE_INVESTIGATE_MAX_NEW_TOKENS, value: {{ .Values.triage.investigateMaxNewTokens | quote }}}
            - {name: SMTP_HOST, value: {{ .Values.smtp.host | quote }}}
            - {name: SMTP_PORT, value: {{ .Values.smtp.port | quote }}}
            - {name: SMTP_USERNAME, value: {{ .Values.smtp.username | quote }}}
            - name: SMTP_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.smtp }}, key: SMTP_PASSWORD}}
            - {name: SMTP_FROM, value: {{ .Values.smtp.from | quote }}}
            - {name: SMTP_TO, value: {{ .Values.smtp.to | quote }}}
            - {name: PUBLIC_URL, value: {{ .Values.ui.publicUrl | quote }}}
            {{- with .Values.ui.oidc }}
            {{- if .issuer }}
            - {name: OIDC_ISSUER, value: {{ .issuer | quote }}}
            - {name: OIDC_CLIENT_ID, value: {{ .clientId | quote }}}
            - name: OIDC_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ required "ui.oidc.secret (key client_secret)" .secret }}, key: client_secret}}
            {{- end }}
            {{- end }}
          volumeMounts:
            - {name: files, mountPath: /etc/incident-operator/primer, readOnly: true}
            - {name: runbooks, mountPath: /etc/incident-operator/runbooks, readOnly: true}
            - {name: operations, mountPath: /etc/incident-operator/operations, readOnly: true}
          readinessProbe:
            httpGet: {path: /healthz, port: ui}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: webhook}
            periodSeconds: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: files
          configMap: {name: incident-operator-files}
        - name: runbooks
          configMap: {name: incident-operator-runbooks}
        - name: operations
          configMap: {name: incident-operator-operations}
---
apiVersion: v1
kind: Service
metadata:
  name: incident-operator
  labels: {{- toYaml $labels | nindent 4 }}
spec:
  selector: {app: incident-operator}
  ports: [{name: http, port: 80, targetPort: ui}]
---
# Alertmanager's webhook target, and /metrics. In-cluster only: no Ingress points here, so nobody outside can inject
# alerts.
apiVersion: v1
kind: Service
metadata:
  name: incident-operator-webhook
  labels:
    {{- toYaml $labels | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  selector: {app: incident-operator}
  ports: [{name: http, port: 80, targetPort: webhook}]
---
# The page. With ui.tlsSecretName it is public (Cloudflare -> traefik-public, DNS by external-dns, certificate by
# cert-manager, and the public entrypoint's origin lockdown and rate limits), which needs sign-in: the chart refuses
# a public page without ui.oidc.issuer. Without it, LAN only (the cluster.local wildcard -> internal Traefik).
{{- if and .Values.ui.tlsSecretName (not .Values.ui.oidc.issuer) }}
{{- fail "ui.tlsSecretName makes the incident page public: set ui.oidc.issuer (and ui.oidc.secret) too" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: incident-operator
  labels:
    {{- toYaml $labels | nindent 4 }}
    {{- if .Values.ui.tlsSecretName }}
    dns.danwils.com/public: "true"
    {{- end }}
  {{- if .Values.ui.tlsSecretName }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: pubsecure
    external-dns.kubernetes.io/target: danwils.com
  {{- end }}
spec:
  ingressClassName: traefik
  {{- if .Values.ui.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.ui.host }}]
      secretName: {{ .Values.ui.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ui.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: incident-operator, port: {name: http}}
---
# The executor (design §7.2, executor.py): runs fixes approved in the UI, one verb at a time. Its own ServiceAccount
# whose rights are generated from the mutating operations in files/operations: for each one, a Role in each namespace
# it lists, with exactly what its verb needs. A fix that isn't committed has no rights to use.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-operator-executor
  labels: {{- toYaml $labels | nindent 4 }}
{{- range $path, $_ := .Files.Glob "files/operations/*.yaml" }}
{{- $op := $.Files.Get $path | fromYaml }}
{{- if $op.mutating }}
{{- range $ns := $op.run.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-operator-fix-{{ $op.name }}
  namespace: {{ $ns }}
  labels: {{- toYaml $labels | nindent 4 }}
rules:
  {{- if eq $op.run.verb "DeletePods" }}
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, delete]
  {{- else if eq $op.run.verb "CreateJobFrom" }}
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create]
  {{- else }}
  {{- fail (printf "operation %s: the chart doesn't know verb %s's RBAC" $op.name $op.run.verb) }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-operator-fix-{{ $op.name }}
  namespace: {{ $ns }}
  labels: {{- toYaml $labels | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: incident-operator-fix-{{ $op.name }}}
subjects:
  - {kind: ServiceAccount, name: incident-operator-executor, namespace: {{ $.Release.Namespace }}}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-operator-executor
  labels: {{- toYaml $labels | nindent 4 }}
spec:
  # Off until the image has the executor: an older image ignores the `executor` argument and starts a second controller.
  replicas: {{ if .Values.executor.enabled }}1{{ else }}0{{ end }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: incident-operator-executor}
  template:
    metadata:
      labels: {app: incident-operator-executor}
    spec:
      serviceAccountName: incident-operator-executor
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: executor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: [python, -m, incident_operator, executor]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.database }}, key: DATABASE_URL}}
            - {name: OPERATIONS_DIR, value: /etc/incident-operator/operations}
          volumeMounts:
            - {name: operations, mountPath: /etc/incident-operator/operations, readOnly: true}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{- toYaml .Values.executorResources | nindent 12 }}
      volumes:
        - name: operations
          configMap: {name: incident-operator-operations}
{{- if .Values.metrics.enabled }}
---
# The operator's own health (app.py /metrics on the webhook port; never the UI's, which needs sign-in).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: incident-operator
  labels:
    {{- toYaml $labels | nindent 4 }}
    {{- toYaml .Values.metrics.labels | nindent 4 }}
spec:
  selector:
    matchLabels: {app.kubernetes.io/part-of: incident-operator, app.kubernetes.io/component: webhook}
  endpoints:
    - {port: http, path: /metrics, interval: 60s}
---
# Alerts for when triage itself stops. Routed to email only (cluster-config cluster-alerts.yaml), never back to this
# operator's webhook: a stuck operator can't triage its own outage.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: incident-operator
  labels:
    {{- toYaml $labels | nindent 4 }}
    {{- toYaml .Values.metrics.labels | nindent 4 }}
spec:
  groups:
    - name: incident-operator
      rules:
        - alert: IncidentOperatorDown
          expr: absent(incident_operator_last_pass_timestamp_seconds) or (time() - incident_operator_last_pass_timestamp_seconds) > 300
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: incident-operator's triage loop hasn't completed a pass in 15+ minutes; alerts aren't being triaged and approved fixes aren't checked.
        - alert: IncidentOperatorTriageStalled
          expr: incident_operator_oldest_waiting_seconds > 3600
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "An incident has waited {{ "{{" }} $value | humanizeDuration {{ "}}" }} for triage: gpu-scheduler unreachable or failing, or the hourly cap is holding back a storm."
        - alert: IncidentOperatorEmailFailing
          expr: incident_operator_oldest_unmailed_seconds > 1800
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: incident-operator has answered incidents it hasn't been able to mail for 30+ minutes (check its log for SMTP errors).
{{- end }}
