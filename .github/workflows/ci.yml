name: incident-operator-ci

# Chart and doc changes (including the primer and runbooks, which live in the chart) don't touch the image.
on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'helm/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'helm/**']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        env:
          INCIDENT_OPERATOR_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          PGPASSWORD: ci              # libpq reads it; the URL carries no password
        run: |
          pip install -e '.[test]'
          pytest -q

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: tags
        run: echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/incident-operator:latest
          cache-to: type=inline
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/incident-operator:${{ steps.tags.outputs.sha_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/incident-operator:latest
