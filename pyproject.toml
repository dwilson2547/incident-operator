[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-operator"
version = "0.1.0"
description = "Alertmanager alerts -> incidents, triaged by a local LLM through gpu-scheduler (docs/design.md)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "aiosmtpd>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
incident_operator = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
